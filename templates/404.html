<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found — PlacementAI" />
  <title>404 — Page Not Found | PlacementAI</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <style>
    .error-page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem 1rem; text-align: center; position: relative; overflow: hidden;
    }
    .error-code {
      font-family: var(--font-display); font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 900; line-height: 1; letter-spacing: -0.05em;
      background: var(--gradient-primary);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; opacity: 0.25; margin-bottom: -1rem;
    }
    .error-icon { font-size: 5rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
    .error-title {
      font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800; color: var(--text-primary); margin-bottom: 1rem;
    }
    .error-desc { font-size: 1rem; color: var(--text-secondary); max-width: 450px; line-height: 1.7; margin-bottom: 2.5rem; }
    .error-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom" aria-label="Main navigation">
  <div class="container">
    <a class="navbar-brand-logo" href="{{ url_for('index') }}">
      <div class="brand-icon"><i class="bi bi-mortarboard-fill text-white"></i></div>
      <div><div class="brand-text">PlacementAI</div><div class="brand-subtitle">Prediction System</div></div>
    </a>
  </div>
</nav>

<main class="error-page" role="main">
  <div class="hero-grid-bg" aria-hidden="true"></div>
  <div class="z-1">
    <div class="error-code" aria-hidden="true">404</div>
    <div class="error-icon" aria-hidden="true">🔍</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you are looking for doesn't exist, has been moved, or the URL might be incorrect.
      Let's get you back on track.
    </p>
    <div class="error-actions">
      <a href="{{ url_for('index') }}" class="btn-primary-custom" id="error404HomeBtn">
        <i class="bi bi-house-fill" aria-hidden="true"></i> Go Home
      </a>
      <a href="{{ url_for('predict_form') }}" class="btn-secondary-custom" id="error404PredictBtn">
        <i class="bi bi-lightning-fill" aria-hidden="true"></i> Make Prediction
      </a>
    </div>
    <p style="font-size:0.78rem;color:var(--text-muted);margin-top:3rem;">
      Error Code: 404 &nbsp;|&nbsp; PlacementAI v{{ app_version }}
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
</body>
</html>
